# rig_config.yaml — PAM 単体試験機の設定（isotonic.py / isometric.py / check.py が読む）
# レーザの換算（mm = gain * raw + offset、収縮の向き）は別ファイル laser_calib.json（check.py の cal / dir が書く）

serial:
  port: /dev/ttyUSB0
  baud: 230400            # デプロイ・信号再生と同じ（受信 7 要素）

pam:
  L0_mm: 150.0            # 試験する PAM の自然長（収縮率 = 変位 / L0）。試験する筋に合わせて直す

limits:
  p_cmd_max: 0.7          # 指令の上限 [MPa]（クリップ）。0.7 は補間用の外側の点。DMSP-10 の使用圧力は 0〜0.8 MPa
                          # ITV は供給圧より上は出せないので、0.7 を測るときは供給を 0.8 MPa 程度に上げる
  p_meas_max: 0.75        # 内圧がこれを越えたら非常停止 [MPa]
  force_max_N: 150.0      # ロードセルの値がこれを越えたら非常停止 [N]（等尺性だけ。等張性はロードセルを使わない）
                          # 治具は 3D プリント＋埋め込みナット。ロボットのロードセル LUR-A-500NSA1 は定格 500 N
  rx_timeout_s: 0.25      # 受信がこれだけ途絶えたら非常停止 [s]
  isometric_move_mm: 2.0  # 等尺性で変位がこれ以上動いたら非常停止（治具のずれ・破損） [mm]
